name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build Web App
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PASIYA-SENSI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build Web App
        run: npm run build
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Build iOS App (Unsigned IPA)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -destination generic/platform=iOS -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r PASIYA-SENSI-iOS.ipa Payload
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PASIYA-SENSI-iOS-IPA
          path: ios/App/build/PASIYA-SENSI-iOS.ipa
